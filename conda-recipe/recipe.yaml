# rattler-build recipe, intended for conda-forge/staged-recipes (after pele is on conda-forge).
# local test: rattler-build build -r conda-recipe/recipe.yaml -c conda-forge -c <channel with pele>
context:
  name: basinvolume
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # TODO(release): switch to the tagged tarball + sha256 for conda-forge
  path: ..

build:
  number: 0
  skip:
    - win
  script:
    env:
      BV_NATIVE: "0"  # portable binaries, no -march=native
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.18
    - ninja
  host:
    - python
    - pip
    - setuptools >=65
    - wheel
    - cython >=3
    - numpy
    - pele
    - mcpele
    - pycg_descent
    - eigen
    - sundials >=6.2
    - libblas
    - liblapack
    - blas-devel
  run:
    - python
    - pele
    - mcpele
    - pycg_descent
    - numpy
    - scipy
    - matplotlib-base
    - future
    - toml

tests:
  - python:
      imports:
        - basinvolume
        - basinvolume.monte_carlo._conf_test_cpp
        - basinvolume.utils._utils_cpp
      pip_check: false

about:
  homepage: https://github.com/spraharsh/basinvolume
  summary: Basin volume calculations for energy landscapes
  # TODO: basinvolume has no LICENSE file yet; conda-forge requires license + license_file

extra:
  recipe-maintainers:
    - spraharsh
